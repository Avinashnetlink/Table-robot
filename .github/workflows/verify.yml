name: Verify robot
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r code/laptop/requirements.txt
      - run: python tools/test.py
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: python3 tools/build_firmware.py --install --all
      - run: python3 tools/build_firmware.py --edge-sensor vl53l0x --output build-vl53l0x
