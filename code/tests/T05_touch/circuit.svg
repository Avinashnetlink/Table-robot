   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243342" x="522" y="58.297852" transform="rotate(-0 522 58.297852)">USB power. R13 is in series, close to D0. No external touch-controller module.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243342" x="522" y="560.598047" transform="rotate(-0 522 560.598047)">Same named power/ground = same wire. Dot = joined. Bridge = crossing only. Pin names, not physical header order.</text>
   </g>
