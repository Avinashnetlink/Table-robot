   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243342" x="540" y="58.297852" transform="rotate(-0 540 58.297852)">Default NO parallel wiring: BUMPER_NC_SERIES=false. USB power only.</text>
   </g>
