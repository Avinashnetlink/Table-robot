   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243342" x="540" y="58.297852" transform="rotate(-0 540 58.297852)">Only XIAO + antenna + USB power required. Network path is dashed, not a wire.</text>
